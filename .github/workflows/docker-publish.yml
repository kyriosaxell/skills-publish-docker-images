name: Docker Publish

on:
  push:
    branches:
      - master

permissions:
  contents: read
  packages: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Log in to the Container registry
        uses: docker/build-push-action@v7
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push Docker image
        run: |
          docker build -t ghcr.io/${{ github.repository_owner }}/skills_publish_docker-images/stackoverflown:latest .
          docker push ghcr.io/${{ github.repository_owner }}/skills_publish_docker-images/stackoverflown:latest